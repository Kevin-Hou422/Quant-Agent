# requirements.lock —— **一次经过验证的完整环境**的逐位记录
#
# 这份文件回答的问题是"用哪一套版本跑出来的那批结果"，
# 不是"允许哪些版本"（后者在 requirements.txt）。
#
# 正式安装入口
# ------------
#   · CI 的阻塞任务装 **本文件**（可复现：同一份 lock 永远装出同一套版本）
#   · 另有一个**非阻塞**任务装 requirements.txt（当日最新），用来提前看见依赖漂移
#   · 本机开发装哪个都行，但**验证依赖完整性只认干净环境**
#     —— 开发机装的包永远多于声明（CI 事故 2026-09-10 的根因就是这个）
#
# 本次生成方式（2026-09-16）
# --------------------------
#   python -m venv <tmp> && pip install -r requirements.txt
#   → 跑完整后端套件：3781 passed / 1 skipped / 32 xfailed / 0 failed
#   → pip freeze 写入本文件
#
# 上一版（2026-07-30）已过期，且**漏了 requirements.txt 里声明的
# pandas_market_calendars** —— 照它安装会让 market_calendar.py 静默退回
# pd.bdate_range（把节假日当交易日，外部审计 #6 的原始现场）。
# 现在由 tests/meta/test_lessons_enforced.py::TestLessonC 逐条核对
# "txt 里声明的每一个包都必须出现在 lock 里"，漏一个就判红。
#
# 不要手工编辑。重新生成见上面的步骤。
